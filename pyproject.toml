[project]
name = "simple-ai-chatbot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "distro==1.9.0",
    "fastapi==0.141.1",
    "groq==0.37.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpcore2==2.13.1 ; sys_platform != 'emscripten'",
    "httptools==0.8.0",
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "httpx2-jsfetch==1.0 ; sys_platform == 'emscripten'",
    "idna==3.20",
    "jsonpatch==1.33",
    "jsonpointer==3.1.1",
    "langchain==1.4.2",
    "langchain-core==1.6.5",
    "langchain-groq==1.1.3",
    "langchain-protocol==0.0.19",
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.2.0",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.5",
    "langsmith==0.14.0",
    "orjson==3.12.0",
    "ormsgpack==1.12.2",
    "packaging==26.3",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "requests-toolbelt==1.0.0",
    "sniffio==1.3.1",
    "starlette==1.7.0",
    "tenacity==9.1.4",
    "truststore==0.10.4 ; sys_platform != 'emscripten'",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.8.0",
    "uuid-utils==0.17.1",
    "uvicorn[standard]==0.54.0",
    "uvloop==0.22.1 ; platform_python_implementation != 'PyPy' and sys_platform != 'cygwin' and sys_platform != 'win32'",
    "watchfiles==1.3.0",
    "websockets==16.1.1",
    "xxhash==4.0.1",
    "zstandard==0.25.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["apps/chatbot/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
